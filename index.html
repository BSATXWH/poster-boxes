*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}

.m{flex:1;min-width:0}
.bs{font:700 18px/1.2 ui-monospace,"SF Mono",Menlo,monospace}
.t{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--chip-ink);font:700 11px/1.4 -apple-system,Arial,sans-serif;letter-spacing:.06em;vertical-align:2px}
.w{margin-top:4px;font-weight:600;overflow-wrap:anywhere}
.s{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.q{flex:none;min-width:56px;text-align:center}
.q b{display:block;font:800 32px/1 "Helvetica Neue",Arial,sans-serif}
.q span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.empty,.foot{color:var(--muted)}
.foot{margin-top:20px;font-size:13px}
</style></head>
